<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>点菜系统</title>
    <style>
        /* 全局样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background-color: #f5f5f5;
            padding: 10px;
        }
        button {
            cursor: pointer;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            padding: 8px 16px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        /* 界面通用隐藏/显示 */
        .page {
            display: none;
            width: 100%;
        }
        .page.active {
            display: block;
        }

        /* 一级界面：桌号选择页 */
        .table-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .table-card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: relative;
        }
        .table-card h3 {
            font-size: 20px;
            margin-bottom: 10px;
        }
        .queue-select {
            width: 60px;
            height: 30px;
            font-size: 16px;
            text-align: center;
            margin-bottom: 10px;
        }
        .enter-table-btn {
            background: #4299e1;
            color: white;
            width: 100%;
            margin-top: 10px;
        }

        /* 二级界面：桌号点菜页 */
        .table-header {
            background: #4299e1;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .table-header h2 {
            font-size: 24px;
        }
        .quick-order-btn {
            background: white;
            color: #4299e1;
            font-weight: bold;
        }
        .back-btn {
            background: #f56565;
            color: white;
            margin-left: 10px;
        }
        /* 菜品检索/分类 */
        .dish-filter {
            margin-bottom: 20px;
        }
        .search-input {
            width: 100%;
            height: 40px;
            padding: 0 10px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .category-tabs {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        .category-tab {
            background: #e2e8f0;
            padding: 8px 15px;
            border-radius: 20px;
            white-space: nowrap;
        }
        .category-tab.active {
            background: #4299e1;
            color: white;
        }
        /* 菜品列表 */
        .dish-list {
            max-height: 500px;
            overflow-y: auto;
            background: white;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 20px;
        }
        .dish-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        .dish-item:last-child {
            border-bottom: none;
        }
        .serve-status {
            width: 24px;
            height: 24px;
            border: 2px solid #999;
            border-radius: 4px;
            margin-right: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .serve-status.served {
            background: #48bb78;
            border-color: #48bb78;
            color: white;
        }
        .dish-name {
            flex: 1;
            font-size: 18px;
        }
        .add-dish-btn {
            background: #4299e1;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
        }
        /* 统计和小票 */
        .order-footer {
            background: white;
            padding: 15px;
            border-radius: 8px;
        }
        .dish-count {
            font-size: 18px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .generate-ticket-btn {
            width: 100%;
            background: #48bb78;
            color: white;
            font-size: 18px;
            padding: 12px 0;
        }

        /* 三级界面：快捷点菜页 */
        .quick-order-header {
            background: #4299e1;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .number-list {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .number-item {
            height: 60px;
            border: 2px solid #ddd;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
        }
        .number-item.selected {
            background: #4299e1;
            color: white;
            border-color: #4299e1;
        }
        .confirm-add-btn {
            width: 100%;
            background: #48bb78;
            color: white;
            font-size: 20px;
            padding: 15px 0;
        }
    </style>
</head>

    <script>
        // 全局数据：模拟小票的菜品数据（区分菜品/酒水，给菜品编编号）
        const dishData = [
            // 热菜（有编号）
            { id: 1, name: "麻辣小龙虾", category: "热菜", isDrink: false },
            { id: 2, name: "水煮鱼", category: "热菜", isDrink: false },
            { id: 3, name: "回锅肉", category: "热菜", isDrink: false },
            { id: 4, name: "宫保鸡丁", category: "热菜", isDrink: false },
            { id: 5, name: "鱼香肉丝", category: "热菜", isDrink: false },
            { id: 6, name: "红烧肉", category: "热菜", isDrink: false },
            { id: 7, name: "糖醋排骨", category: "热菜", isDrink: false },
            { id: 8, name: "麻婆豆腐", category: "热菜", isDrink: false },
            { id: 9, name: "青椒炒肉", category: "热菜", isDrink: false },
            { id: 10, name: "番茄炒蛋", category: "热菜", isDrink: false },
            // 凉菜（有编号）
            { id: 11, name: "拍黄瓜", category: "凉菜", isDrink: false },
            { id: 12, name: "凉拌木耳", category: "凉菜", isDrink: false },
            { id: 13, name: "夫妻肺片", category: "凉菜", isDrink: false },
            { id: 14, name: "凉拌猪耳朵", category: "凉菜", isDrink: false },
            { id: 15, name: "泡椒凤爪", category: "凉菜", isDrink: false },
            // 主食（有编号）
            { id: 16, name: "米饭", category: "主食", isDrink: false },
            { id: 17, name: "馒头", category: "主食", isDrink: false },
            { id: 18, name: "面条", category: "主食", isDrink: false },
            // 酒水（无编号）
            { id: "", name: "啤酒", category: "酒水", isDrink: true },
            { id: "", name: "白酒", category: "酒水", isDrink: true },
            { id: "", name: "可乐", category: "酒水", isDrink: true },
            { id: "", name: "雪碧", category: "酒水", isDrink: true },
            { id: "", name: "矿泉水", category: "酒水", isDrink: true },
        ];

        // 全局状态：当前桌号、已点菜品、快捷点菜选中的编号
        let currentTable = "";
        let orderedDishes = [];
        let selectedNumbers = [];

        // 1. 界面切换函数
        function switchPage(pageId) {
            // 隐藏所有页面
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });
            // 显示目标页面
            document.getElementById(pageId).classList.add('active');
        }

        // 2. 一级界面：点击桌号进入点菜页
        document.querySelectorAll('.enter-table-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                // 获取当前桌号
                currentTable = this.closest('.table-card').dataset.table;
                // 更新桌号显示
                document.getElementById('currentTable').textContent = currentTable;
                // 重置已点菜品（可根据需求改为保留历史，这里默认切换桌号清空）
                orderedDishes = [];
                // 更新菜品列表和统计
                updateOrderedDishList();
                // 切换到点菜页
                switchPage('orderPage');
            });
        });

        // 3. 二级界面：菜品搜索和分类筛选
        // 搜索功能
        document.getElementById('dishSearch').addEventListener('input', function() {
            updateOrderedDishList();
        });
        // 分类切换
        document.querySelectorAll('.category-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                // 移除所有active
                document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
                // 添加当前active
                this.classList.add('active');
                // 更新菜品列表
                updateOrderedDishList();
            });
        });

        // 4. 生成已点菜品列表（含上菜状态）
        function updateOrderedDishList() {
            const dishListEl = document.getElementById('orderedDishList');
            const searchText = document.getElementById('dishSearch').value.toLowerCase();
            const activeCategory = document.querySelector('.category-tab.active').dataset.category;
            
            // 筛选菜品
            let filteredDishes = dishData;
            if (activeCategory !== 'all') {
                filteredDishes = filteredDishes.filter(d => d.category === activeCategory);
            }
            if (searchText) {
                filteredDishes = filteredDishes.filter(d => d.name.toLowerCase().includes(searchText));
            }

            // 生成菜品列表HTML
            let html = '';
            filteredDishes.forEach(dish => {
                // 检查该菜品是否已点
                const orderedDish = orderedDishes.find(d => d.id === dish.id);
                // 上菜状态：已点且已上菜为true，否则false
                const isServed = orderedDish ? orderedDish.isServed : false;
                
                html += `
                    <div class="dish-item" data-dish-id="${dish.id}">
                        ${!dish.isDrink ? `
                            <div class="serve-status ${isServed ? 'served' : ''}" onclick="toggleServeStatus(${dish.id})">
                                ${isServed ? '√' : ''}
                            </div>
                        ` : ''}
                        <div class="dish-name">${dish.name}</div>
                        <button class="add-dish-btn" onclick="addDish(${dish.id})">
                            ${orderedDish ? '已点' : '添加'}
                        </button>
                    </div>
                `;
            });
            dishListEl.innerHTML = html;

            // 更新菜品总数（仅统计非酒水）
            const nonDrinkCount = orderedDishes.filter(d => !d.isDrink).length;
            document.getElementById('dishCountNum').textContent = nonDrinkCount;
        }

        // 5. 添加菜品到已点列表
        function addDish(dishId) {
            // 找到对应菜品
            const dish = dishData.find(d => d.id === dishId);
            if (!dish) return;

            // 检查是否已添加，避免重复
            const isAlreadyAdded = orderedDishes.some(d => d.id === dishId);
            if (isAlreadyAdded) return;

            // 添加到已点列表（默认未上菜）
            orderedDishes.push({
                id: dish.id,
                name: dish.name,
                category: dish.category,
                isDrink: dish.isDrink,
                isServed: false
            });

            // 更新列表和统计
            updateOrderedDishList();
        }

        // 6. 切换菜品上菜状态
        function toggleServeStatus(dishId) {
            // 找到已点菜品
            const dish = orderedDishes.find(d => d.id === dishId);
            if (!dish) return;

            // 切换状态
            dish.isServed = !dish.isServed;

            // 更新列表
            updateOrderedDishList();
        }

        // 7. 三级界面：快捷点菜初始化（生成菜品编号）
        document.querySelector('.quick-order-btn').addEventListener('click', function() {
            // 重置选中的编号
            selectedNumbers = [];
            // 生成菜品编号列表（仅非酒水）
            const numberListEl = document.getElementById('dishNumberList');
            const nonDrinkDishes = dishData.filter(d => !d.isDrink && d.id);
            
            let html = '';
            nonDrinkDishes.forEach(dish => {
                html += `
                    <div class="number-item" data-dish-id="${dish.id}" onclick="toggleNumberSelect(${dish.id})">
                        ${dish.id} - ${dish.name}
                    </div>
                `;
            });
            numberListEl.innerHTML = html;

            // 切换到快捷点菜页
            switchPage('quickOrderPage');
        });

        // 8. 快捷点菜：选中/取消编号
        function toggleNumberSelect(dishId) {
            const numberItem = document.querySelector(`.number-item[data-dish-id="${dishId}"]`);
            const index = selectedNumbers.indexOf(dishId);

            if (index > -1) {
                // 取消选中
                selectedNumbers.splice(index, 1);
                numberItem.classList.remove('selected');
            } else {
                // 选中
                selectedNumbers.push(dishId);
                numberItem.classList.add('selected');
            }
        }

        // 9. 快捷点菜：确认加菜
        function confirmQuickOrder() {
            if (selectedNumbers.length === 0) {
                alert('请选择菜品编号！');
                return;
            }

            // 批量添加选中的菜品
            selectedNumbers.forEach(dishId => {
                addDish(dishId);
            });

            // 返回二级点菜页
            switchPage('orderPage');

            // 提示
            alert(`已添加 ${selectedNumbers.length} 道菜品！`);
        }

        // 10. 生成小票（模拟功能，可对接原小票逻辑）
        function generateTicket() {
            if (orderedDishes.length === 0) {
                alert('暂无已点菜品，无法生成小票！');
                return;
            }

            // 构建小票内容
            let ticketContent = `
                桌号：${currentTable}
                排队序号：${document.querySelector(`.table-card[data-table="${currentTable}"] .queue-select`).value || '未设置'}
                ======================
                已点菜品：
            `;

            // 菜品明细（区分上菜状态）
            orderedDishes.forEach(dish => {
                ticketContent += `
                    ${dish.isServed ? '√' : '□'} ${dish.name} (${dish.category})
                `;
            });

            // 统计
            const nonDrinkCount = orderedDishes.filter(d => !d.isDrink).length;
            ticketContent += `
                ======================
                菜品总数：${nonDrinkCount}
                生成时间：${new Date().toLocaleString()}
            `;

            // 模拟生成小票（可替换为原小票的生成逻辑）
            alert('小票已生成：\n' + ticketContent);
            
            // 如需调用原程序的小票生成功能，可在这里添加调用逻辑
            // 例如：window.parent.generateOriginalTicket(orderedDishes, currentTable);
        }

        // 初始化：加载全部菜品列表
        updateOrderedDishList();
    </script>
</body>
</html>
