<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <style>
        body {
            font-family: '微软雅黑', sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 0;
            background: #f5f5f5;
        }
        .navbar {
            display: flex;
            background: #ff5722;
            color: white;
            padding: 10px 0;
            position: relative;
        }
        .nav-item {
            flex: 1;
            text-align: center;
            cursor: pointer;
            padding: 8px 0;
            position: relative;
        }
        .nav-item.active {
            font-weight: bold;
        }
        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: #ffccbc;
        }
        .page {
            padding: 15px;
            display: none;
        }
        .page.active {
            display: block;
        }
        .section {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h3 {
            color: #333;
            margin-top: 0;
        }
        .input-group {
            margin-bottom: 10px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background: #ff5722;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            margin: 2px;
        }
        button:hover {
            opacity: 0.9;
        }
        .item-list {
            margin: 10px 0;
        }
        .item {
            padding: 8px;
            background: #f8f8f8;
            margin: 5px 0;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .category-header {
            background: #e0e0e0;
            padding: 5px;
            font-weight: bold;
            margin-top: 10px;
        }
        #receipt {
            background: #fff;
            padding: 20px;
            margin-top: 15px;
            border: 1px dashed #ccc;
            font-family: 宋体;
        }
        .search-container {
            margin: 10px 0;
            position: relative;
        }
        .search-results {
            position: absolute;
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 100%;
            max-height: 300px;
            overflow-y: auto;
            z-index: 10;
            display: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .search-result-item {
            padding: 8px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
        }
        .search-result-item:hover {
            background: #f0f0f0;
        }
        .selected-item-display {
            margin-left: 10px;
            color: #ff5722;
            font-weight: normal;
        }
        .search-info {
            display: flex;
            justify-content: space-between;
            margin-top: 5px;
            font-size: 12px;
            color: #666;
        }
        .add-item-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
            background: #f8f8f8;
            padding: 10px;
            border-radius: 4px;
        }
        .add-item-container input {
            width: 80px;
            margin: 0;
        }
        .add-item-container button {
            flex: 1;
        }
        .item-details {
            display: flex;
            flex-direction: column;
        }
        .item-name {
            font-weight: bold;
        }
        .item-price {
            color: #ff5722;
        }
        .item-category {
            font-size: 12px;
            color: #666;
        }
        .remove-btn {
            background: #f44336;
        }
        .search-highlight {
            background-color: #fff9c4;
            padding: 0 2px;
            border-radius: 2px;
        }
        .order-summary {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px dashed #eee;
            font-weight: bold;
        }
        .no-items {
            text-align: center;
            padding: 20px;
            color: #888;
        }
        .order-nav {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .order-nav button {
            flex: 1;
            background: #4CAF50;
        }
        .order-nav button:last-child {
            background: #2196F3;
        }
        
        /* 小票样式优化 */
        .receipt-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 3px;
        }
        .receipt-section-title {
            text-align: center;
            font-weight: bold;
            margin: 10px 0;
        }
        
        /* 编辑表单样式 */
        .edit-form {
            background: #f0f8ff;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            border: 1px solid #ddd;
        }
        .fee-container {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .fee-container > div {
            flex: 1;
        }
        .rice-amount-container {
            display: none;
            margin-top: 10px;
        }
        .rice-amount-container input {
            width: 100%;
        }
        
        /* 保存图片按钮样式 */
        .save-image-btn {
            background: #4caf50;
            margin-top: 10px;
            width: 100%;
            padding: 10px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <div class="navbar">
        <div class="nav-item active" data-page="order">点单</div>
        <div class="nav-item" data-page="dish">菜品管理</div>
        <div class="nav-item" data-page="drink">酒水管理</div>
    </div>

    <!-- 点单页面 -->
    <div id="orderPage" class="page active">
        <div class="section">
            <h3>当前订单</h3>
            <div class="input-group">
                <label for="tableNumber">桌号</label>
                <input type="text" id="tableNumber" placeholder="桌号">
            </div>
            
            <!-- 搜索框 -->
            <div class="search-container">
                <input type="text" id="itemSearch" placeholder="搜索单品（如：鱼、啤酒）" oninput="searchItems()">
                <div class="search-info">
                    <span>提示：输入菜品或酒水名称</span>
                    <span>共 <span id="totalItems">0</span> 个单品</span>
                </div>
                <div class="search-results" id="searchResults"></div>
            </div>
            
            <!-- 添加到订单区域 -->
            <div id="addItemArea" style="display:none;">
                <div class="add-item-container">
                    <div class="item-details">
                        <span class="item-name" id="selectedItemName">未选择</span>
                        <div>
                            <span class="item-price" id="selectedItemPrice">¥0.00</span>
                            <span class="item-category" id="selectedItemCategory"></span>
                        </div>
                    </div>
                    <input type="number" id="itemCount" min="1" placeholder="数量">
                    <button onclick="addSelectedItem()">添加到订单</button>
                </div>
                
                <!-- 米饭金额输入区域 -->
                <div class="rice-amount-container" id="riceAmountContainer">
                    <label for="riceAmount">米饭金额</label>
                    <input type="number" id="riceAmount" step="0.1" placeholder="输入米饭金额">
                </div>
            </div>
            
            <!-- 订单项目列表 -->
            <div id="orderItemsContainer">
                <div id="orderItems"></div>
                <div class="order-summary">
                    <span>合计:</span>
                    <span id="orderTotal">¥0.00</span>
                </div>
            </div>
            
            <!-- 额外费用和折扣费用 -->
            <div class="input-group">
                <label for="extraFeeNote">额外费用备注</label>
                <input type="text" id="extraFeeNote" placeholder="额外费用备注（如：纸巾、服务费等）">
                <label for="extraFee">额外费用</label>
                <input type="number" id="extraFee" step="0.1" placeholder="额外费用金额">
                
                <label for="discountFee">折扣费用</label>
                <input type="number" id="discountFee" step="0.1" placeholder="折扣费用金额">
                
                <div class="order-nav">
                    <button onclick="loadPrevOrder()">上一个订单</button>
                    <button onclick="printReceipt()">生成小票</button>
                    <button onclick="loadNextOrder()">下一个订单</button>
                </div>
            </div>
        </div>

        <!-- 小票显示区域 -->
        <div class="section" id="receiptArea">
            <h3>打印小票</h3>
            <div id="receipt"></div>
            <!-- 保存图片按钮 -->
            <button class="save-image-btn" onclick="saveReceiptAsImage()">保存为图片</button>
        </div>
    </div>

    <!-- 菜品管理页面 -->
    <div id="dishPage" class="page">
        <div class="section">
            <h3>菜品管理</h3>
            <div class="input-group">
                <label for="dishName">菜品名称</label>
                <input type="text" id="dishName" placeholder="菜品名称（如：麻辣烤鱼）">
                <label for="dishPrice">单价</label>
                <input type="number" id="dishPrice" step="0.1" placeholder="单价（如：68.0）">
                <label for="dishCategory">分类</label>
                <select id="dishCategory">
                    <option value="烤鱼类">烤鱼类</option>
                    <option value="汤锅类">汤锅类</option>
                    <option value="炒菜类">炒菜类</option>
                    <option value="干锅铁板">干锅铁板</option>
                    <option value="凉菜类">凉菜类</option>
                    <option value="配菜类">配菜类</option>
                    <option value="主食点心">主食点心</option>
                </select>
                <button onclick="addItem('dish')">添加菜品</button>
            </div>
            <div class="item-list" id="dishList"></div>
        </div>
    </div>

    <!-- 酒水管理页面 -->
    <div id="drinkPage" class="page">
        <div class="section">
            <h3>酒水管理</h3>
            <div class="input-group">
                <label for="drinkName">酒水名称</label>
                <input type="text" id="drinkName" placeholder="酒水名称（如：青岛啤酒）">
                <label for="drinkPrice">单价</label>
                <input type="number" id="drinkPrice" step="0.1" placeholder="单价（如：8.0）">
                <label for="drinkCategory">分类</label>
                <select id="drinkCategory">
                    <option value="啤酒类">啤酒类</option>
                    <option value="白酒类">白酒类</option>
                    <option value="饮料类">饮料类</option>
                </select>
                <button onclick="addItem('drink')">添加酒水</button>
            </div>
            <div class="item-list" id="drinkList"></div>
        </div>
    </div>

            // 饮料类
            { name: '小天地壹号', price: 6, category: '饮料类' },

            { name: '大椰汁', price: 20, category: '饮料类' },
            { name: '大橙汁', price: 10, category: '饮料类' },
            { name: '小可乐', price: 4, category: '饮料类' },
            { name: '大可乐', price: 10, category: '饮料类' },
            { name: '小雪碧', price: 4, category: '饮料类' },

        ];


        // 初始化本地存储
        let dishes = [];
        let drinks = [];
        let currentOrder = [];
        let selectedItem = null;
        let orderHistory = [];
        let currentHistoryIndex = -1;

        // 初始化数据
        function initData() {
            // 检查本地存储中是否已有数据
            if (!localStorage.getItem('dishes')) {
                localStorage.setItem('dishes', JSON.stringify(DEFAULT_DISHES));
                dishes = [...DEFAULT_DISHES];
            } else {
                dishes = JSON.parse(localStorage.getItem('dishes'));
            }
            
            if (!localStorage.getItem('drinks')) {
                localStorage.setItem('drinks', JSON.stringify(DEFAULT_DRINKS));
                drinks = [...DEFAULT_DRINKS];
            } else {
                drinks = JSON.parse(localStorage.getItem('drinks'));
            }
            
            // 加载订单历史
            if (localStorage.getItem('orderHistory')) {
                orderHistory = JSON.parse(localStorage.getItem('orderHistory'));
            }
            
            // 更新总项目数
            document.getElementById('totalItems').textContent = dishes.length + drinks.length;
        }

        // 切换页面
        function switchPage(pageId) {
            // 隐藏所有页面
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });
            
            // 显示选中的页面
            document.getElementById(`${pageId}Page`).classList.add('active');
            
            // 更新导航栏状态
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });
            document.querySelector(`.nav-item[data-page="${pageId}"]`).classList.add('active');
            
            // 隐藏搜索结果
            document.getElementById('searchResults').style.display = 'none';
            clearSelectedItemDisplay();
            
            // 如果切换到点单页面，更新订单合计
            if (pageId === 'order') {
                updateOrderTotal();
            }
        }

        // 渲染菜品/酒水列表（按分类分组）
        function renderItems(type) {
            const list = type === 'dish' ? dishes : drinks;
            const container = document.getElementById(`${type}List`);
            
            // 按分类分组
            const categories = {};
            list.forEach((item, index) => {
                if (!categories[item.category]) {
                    categories[item.category] = [];
                }
                categories[item.category].push({...item, originalIndex: index});
            });
            
            // 按分类渲染
            container.innerHTML = Object.keys(categories).map(category => `
                <div class="category-header">${category}</div>
                ${categories[category].map(item => `
                    <div class="item" data-original-index="${item.originalIndex}" data-type="${type}">
                        <span>${item.name} ¥${item.price}</span>
                        <div>
                            <button class="edit-btn" data-original-index="${item.originalIndex}" data-type="${type}">修改</button>
                            <button class="delete-btn" data-original-index="${item.originalIndex}" data-type="${type}">删除</button>
                        </div>
                    </div>
                `).join('')}
            `).join('');
        }

        // 添加新项目
        function addItem(type) {
            const name = document.getElementById(`${type}Name`).value;
            const price = parseFloat(document.getElementById(`${type}Price`).value);
            const category = document.getElementById(`${type}Category`).value;
            
            if (!name || !price || price <= 0) {
                alert('请输入有效的名称和价格（价格需大于0）');
                return;
            }
            
            (type === 'dish' ? dishes : drinks).push({ name, price, category });
            saveToLocalStorage();
            renderItems(type);
            document.getElementById(`${type}Name`).value = '';
            document.getElementById(`${type}Price`).value = '';
            
            // 更新总项目数
            document.getElementById('totalItems').textContent = dishes.length + drinks.length;
        }

        // 修改项目
        function editItem(index, type) {
            const list = type === 'dish' ? dishes : drinks;
            const currentItem = list[index];
            
            // 创建临时编辑表单
            const tempForm = document.createElement('div');
            tempForm.className = 'edit-form';
            tempForm.innerHTML = `
                <div class="input-group">
                    <label for="tempName">名称</label>
                    <input type="text" id="tempName" value="${currentItem.name}" placeholder="名称">
                    <label for="tempPrice">价格</label>
                    <input type="number" id="tempPrice" value="${currentItem.price}" step="0.1" placeholder="价格">
                    <label for="tempCategory">分类</label>
                    <select id="tempCategory">
                        ${type === 'dish' ? `
                            <option value="烤鱼类" ${currentItem.category === '烤鱼类' ? 'selected' : ''}>烤鱼类</option>
                            <option value="汤锅类" ${currentItem.category === '汤锅类' ? 'selected' : ''}>汤锅类</option>
                            <option value="炒菜类" ${currentItem.category === '炒菜类' ? 'selected' : ''}>炒菜类</option>
                            <option value="干锅铁板" ${currentItem.category === '干锅铁板' ? 'selected' : ''}>干锅铁板</option>
                            <option value="凉菜类" ${currentItem.category === '凉菜类' ? 'selected' : ''}>凉菜类</option>
                            <option value="配菜类" ${currentItem.category === '配菜类' ? 'selected' : ''}>配菜类</option>
                            <option value="主食点心" ${currentItem.category === '主食点心' ? 'selected' : ''}>主食点心</option>
                        ` : `
                            <option value="啤酒类" ${currentItem.category === '啤酒类' ? 'selected' : ''}>啤酒类</option>
                            <option value="白酒类" ${currentItem.category === '白酒类' ? 'selected' : ''}>白酒类</option>
                            <option value="饮料类" ${currentItem.category === '饮料类' ? 'selected' : ''}>饮料类</option>
                        `}
                    </select>
                    <button onclick="saveEdit(${index}, '${type}')">保存</button>
                    <button onclick="cancelEdit('${type}')">取消</button>
                </div>
            `;
            
            // 找到对应的项目元素
            const container = document.getElementById(`${type}List`);
            const itemElement = container.querySelector(`.item[data-original-index="${index}"][data-type="${type}"]`);
            
            // 替换当前项为编辑表单
            if (itemElement) {
                itemElement.parentNode.replaceChild(tempForm, itemElement);
            }
        }

        // 保存编辑
        function saveEdit(index, type) {
            const name = document.getElementById('tempName').value;
            const price = parseFloat(document.getElementById('tempPrice').value);
            const category = document.getElementById('tempCategory').value;
            
            if (!name || !price || price <= 0) {
                alert('请输入有效的名称和价格（价格需大于0）');
                return;
            }
            
            (type === 'dish' ? dishes : drinks)[index] = { name, price, category };
            saveToLocalStorage();
            renderItems(type);
        }

        // 取消编辑
        function cancelEdit(type) {
            renderItems(type);
        }

        // 删除项目
        function deleteItem(index, type) {
            if (confirm('确定要删除这个项目吗？')) {
                (type === 'dish' ? dishes : drinks).splice(index, 1);
                saveToLocalStorage();
                renderItems(type);
                
                // 更新总项目数
                document.getElementById('totalItems').textContent = dishes.length + drinks.length;
            }
        }

        // 搜索单品
        function searchItems() {
            const searchTerm = document.getElementById('itemSearch').value.trim().toLowerCase();
            const searchResults = document.getElementById('searchResults');
            
            if (searchTerm.length < 1) {
                searchResults.style.display = 'none';
                document.getElementById('addItemArea').style.display = 'none';
                return;
            }
            
            // 合并所有菜品和酒水
            const allItems = [...dishes, ...drinks];
            
            // 筛选包含搜索词的项目
            const matchedItems = allItems.filter(item => 
                item.name.toLowerCase().includes(searchTerm)
            );
            
            // 渲染搜索结果
            if (matchedItems.length > 0) {
                searchResults.innerHTML = matchedItems.map(item => {
                    // 高亮显示匹配部分
                    const index = item.name.toLowerCase().indexOf(searchTerm);
                    if (index !== -1) {
                        const before = item.name.substring(0, index);
                        const highlight = item.name.substring(index, index + searchTerm.length);
                        const after = item.name.substring(index + searchTerm.length);
                        
                        return `
                            <div class="search-result-item" 
                                 onclick="selectItem('${item.name}', ${item.price}, '${item.category}', '${dishes.includes(item) ? 'dish' : 'drink'}')">
                                <span>${before}<span class="search-highlight">${highlight}</span>${after}</span>
                                <span>¥${item.price}</span>
                        </div>
                        `;
                    }
                    return `
                        <div class="search-result-item" 
                             onclick="selectItem('${item.name}', ${item.price}, '${item.category}', '${dishes.includes(item) ? 'dish' : 'drink'}')">
                            <span>${item.name}</span>
                            <span>¥${item.price}</span>
                        </div>
                    `;
                }).join('');
                searchResults.style.display = 'block';
            } else {
                searchResults.innerHTML = '<div class="search-result-item">未找到匹配的单品</div>';
                searchResults.style.display = 'block';
            }
        }

        // 选择项目
        function selectItem(name, price, category, type) {
            selectedItem = { name, price, category, type };
            
            // 显示选中的单品信息
            document.getElementById('selectedItemName').textContent = name;
            document.getElementById('selectedItemPrice').textContent = `¥${price.toFixed(2)}`;
            document.getElementById('selectedItemCategory').textContent = category;
            
            // 显示添加区域
            document.getElementById('addItemArea').style.display = 'block';
            
            // 隐藏搜索结果
            document.getElementById('searchResults').style.display = 'none';
            document.getElementById('itemSearch').value = name;
            
            // 如果是米饭，显示金额输入框，隐藏数量输入框
            if (name === '米饭') {
                document.getElementById('riceAmountContainer').style.display = 'block';
                document.getElementById('itemCount').style.display = 'none';
                document.getElementById('riceAmount').value = '';
            } else {
                document.getElementById('riceAmountContainer').style.display = 'none';
                document.getElementById('itemCount').style.display = 'block';
                
                // 如果是啤酒类，清空数量框，否则设为默认1
                if (category === '啤酒类') {
                    document.getElementById('itemCount').value = '';
                } else {
                    document.getElementById('itemCount').value = '1';
                }
            }
        }

        // 清除选中单品显示
        function clearSelectedItemDisplay() {
            selectedItem = null;
            document.getElementById('itemSearch').value = '';
            document.getElementById('addItemArea').style.display = 'none';
            document.getElementById('riceAmountContainer').style.display = 'none';
            document.getElementById('itemCount').style.display = 'block';
        }

        // 添加选中的项目到订单
        function addSelectedItem() {
            if (!selectedItem) {
                alert('请先选择一个项目');
                return;
            }
            
            let count, finalPrice;
            
            // 处理米饭的特殊情况
            if (selectedItem.name === '米饭') {
                finalPrice = parseFloat(document.getElementById('riceAmount').value) || 0;
                if (finalPrice <= 0) {
                    alert('请输入有效的米饭金额');
                    return;
                }
                count = 1;
            } else {
                count = parseInt(document.getElementById('itemCount').value) || 1;
                if (count < 1) {
                    alert('请输入有效数量（至少1份）');
                    return;
                }
                finalPrice = selectedItem.price;
            }
            
            // 检查是否已经存在相同的项目
            const existingItemIndex = currentOrder.findIndex(item => 
                item.name === selectedItem.name && item.price === finalPrice
            );
            
            if (existingItemIndex !== -1) {
                // 如果已存在，增加数量
                currentOrder[existingItemIndex].count += count;
            } else {
                // 否则添加新项目
                currentOrder.push({
                    name: selectedItem.name,
                    price: finalPrice,
                    count: count,
                    category: selectedItem.category,
                    type: selectedItem.type
                });
            }
            
            renderOrderItems();
            clearSelectedItemDisplay();
            document.getElementById('itemCount').value = '';
        }

        // 渲染订单项目
        function renderOrderItems() {
            const container = document.getElementById('orderItems');
            
            if (currentOrder.length === 0) {
                container.innerHTML = '<div class="no-items">当前没有订单项目</div>';
                updateOrderTotal();
                return;
            }
            
            container.innerHTML = currentOrder.map((item, index) => `
                <div class="item">
                    <span>${item.name} (${item.category}) ${item.name === '米饭' ? '' : '×' + item.count} ¥${(item.price * item.count).toFixed(2)}</span>
                    <button class="remove-btn" onclick="removeOrderItem(${index})">删除</button>
                </div>
            `).join('');
            
            updateOrderTotal();
        }

        // 更新订单合计
        function updateOrderTotal() {
            const itemsTotal = currentOrder.reduce((sum, item) => sum + (item.price * item.count), 0);
            document.getElementById('orderTotal').textContent = `¥${itemsTotal.toFixed(2)}`;
        }

        // 删除订单项目
        function removeOrderItem(index) {
            currentOrder.splice(index, 1);
            renderOrderItems();
        }

        // 生成小票
        function printReceipt() {
            const tableNumber = document.getElementById('tableNumber').value;
            const extraFeeNote = document.getElementById('extraFeeNote').value;
            const extraFeeInput = document.getElementById('extraFee');
            const extraFee = extraFeeInput.value ? parseFloat(extraFeeInput.value) : 0;
            const discountFeeInput = document.getElementById('discountFee');
            const discountFee = discountFeeInput.value ? parseFloat(discountFeeInput.value) : 0;
            
            const itemsTotal = currentOrder.reduce((sum, item) => sum + (item.price * item.count), 0);
            const grandTotal = itemsTotal + extraFee - discountFee;
            const time = new Date().toLocaleString('zh-CN', { 
                year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit', second: '2-digit'
            });
            
            // 按分类分组
            const dishCategories = {};
            const drinkCategories = {};
            
            currentOrder.forEach(item => {
                if (item.type === 'dish') {
                    if (!dishCategories[item.category]) {
                        dishCategories[item.category] = [];
                    }
                    dishCategories[item.category].push(item);
                } else {
                    if (!drinkCategories[item.category]) {
                        drinkCategories[item.category] = [];
                    }
                    drinkCategories[item.category].push(item);
                }
            });

            // 使用新的小票格式 - 价格右对齐
            let receiptHtml = `
                <div class="receipt-line">
                    <span>时间：</span>
                    <span>${time}</span>
                </div>
                <div class="receipt-line">
                    <span>桌号：</span>
                    <span>${tableNumber || '未指定'}</span>
                </div>
            `;
            
            // 额外费用
            if (extraFee > 0) {
                if (extraFeeNote && extraFeeNote.length > 5) {
                    receiptHtml += `
                        <div class="receipt-line">
                            <span>额外费用：</span>
                            <span>¥${extraFee.toFixed(2)}</span>
                        </div>
                        <div class="receipt-line">
                            <span>${extraFeeNote}</span>
                            <span></span>
                        </div>
                    `;
                } else {
                    receiptHtml += `
                        <div class="receipt-line">
                            <span>额外费用${extraFeeNote ? ` (${extraFeeNote})` : ''}</span>
                            <span>¥${extraFee.toFixed(2)}</span>
                        </div>
                    `;
                }
            }
            
            // 折扣费用
            if (discountFee > 0) {
                receiptHtml += `
                    <div class="receipt-line">
                        <span>折扣费用</span>
                        <span>-¥${discountFee.toFixed(2)}</span>
                    </div>
                `;
            }
            
            // 菜品部分
            if (Object.keys(dishCategories).length > 0) {
                receiptHtml += `
                    <div class="receipt-section-title">---------- 菜品 ----------</div>
                    ${Object.keys(dishCategories).map(category => `
                        <div style="font-weight: bold; margin-top: 8px;">${category}</div>
                        ${dishCategories[category].map(item => `
                            <div class="receipt-line">
                                <span>${item.name} ${item.name === '米饭' ? '' : '×' + item.count}</span>
                                <span>¥${(item.price * item.count).toFixed(2)}</span>
                            </div>
                        `).join('')}
                    `).join('')}
                `;
            }
            
            // 酒水部分
            if (Object.keys(drinkCategories).length > 0) {
                receiptHtml += `
                    <div class="receipt-section-title">---------- 酒水 ----------</div>
                    ${Object.keys(drinkCategories).map(category => `
                        <div style="font-weight: bold; margin-top: 8px;">${category}</div>
                        ${drinkCategories[category].map(item => `
                            <div class="receipt-line">
                                <span>${item.name} ×${item.count}</span>
                                <span>¥${(item.price * item.count).toFixed(2)}</span>
                            </div>
                        `).join('')}
                    `).join('')}
                `;
            }
            
            // 总计
            receiptHtml += `
                <div style="margin: 15px 0; border-top: 1px dashed #666;"></div>
                <div class="receipt-line" style="font-weight: bold; font-size: 1.1em;">
                    <span>总计</span>
                    <span>¥${grandTotal.toFixed(2)}</span>
                </div>
            `;
            
            document.getElementById('receipt').innerHTML = receiptHtml;
            
            // 保存当前订单到历史记录
            saveToOrderHistory({
                tableNumber: tableNumber,
                extraFeeNote: extraFeeNote,
                extraFee: extraFee,
                discountFee: discountFee,
                items: [...currentOrder],
                time: time,
                receipt: receiptHtml
            });
        }
        
        // 保存订单到历史记录
        function saveToOrderHistory(order) {
            orderHistory.push(order);
            if (orderHistory.length > 20) {
                orderHistory.shift(); // 只保留最近20个订单
            }
            localStorage.setItem('orderHistory', JSON.stringify(orderHistory));
            currentHistoryIndex = orderHistory.length - 1;
        }
        
        // 加载上一个订单
        function loadPrevOrder() {
            if (orderHistory.length === 0) {
                alert('没有历史订单记录');
                return;
            }
            
            if (currentHistoryIndex <= 0) {
                currentHistoryIndex = 0;
            } else {
                currentHistoryIndex--;
            }
            
            loadOrderFromHistory(currentHistoryIndex);
        }
        
        // 加载下一个订单
        function loadNextOrder() {
            if (orderHistory.length === 0) {
                resetOrder();
                return;
            }
            
            if (currentHistoryIndex >= orderHistory.length - 1) {
                resetOrder();
                return;
            }
            
            currentHistoryIndex++;
            loadOrderFromHistory(currentHistoryIndex);
        }
        
        // 从历史记录加载订单
        function loadOrderFromHistory(index) {
            const order = orderHistory[index];
            
            // 填充数据
            document.getElementById('tableNumber').value = order.tableNumber || '';
            document.getElementById('extraFeeNote').value = order.extraFeeNote || '';
            document.getElementById('extraFee').value = order.extraFee || '';
            document.getElementById('discountFee').value = order.discountFee || '';
            currentOrder = [...order.items];
            
            // 渲染订单和小票
            renderOrderItems();
            document.getElementById('receipt').innerHTML = order.receipt;
        }
        
        // 重置订单
        function resetOrder() {
            document.getElementById('tableNumber').value = '';
            document.getElementById('extraFeeNote').value = '';
            document.getElementById('extraFee').value = '';
            document.getElementById('discountFee').value = '';
            currentOrder = [];
            renderOrderItems();
            document.getElementById('receipt').innerHTML = '';
        }

        // 保存小票为图片
        function saveReceiptAsImage() {
            const receiptElement = document.getElementById('receipt');
            
            // 检查是否有小票内容
            if (!receiptElement.innerHTML.trim()) {
                alert('请先生成小票');
                return;
            }
            
            // 临时保存原始样式
            const originalBorder = receiptElement.style.border;
            const originalPadding = receiptElement.style.padding;
            const originalBackground = receiptElement.style.background;
            const originalMargin = receiptElement.style.margin;
            
            // 设置适合截图的样式
            receiptElement.style.border = 'none';
            receiptElement.style.padding = '10px';
            receiptElement.style.background = '#fff';
            receiptElement.style.margin = '0';
            
            // 使用html2canvas截图
            html2canvas(receiptElement, {
                scale: 3, // 提高分辨率
                backgroundColor: '#ffffff',
                logging: false
            }).then(canvas => {
                // 恢复原始样式
                receiptElement.style.border = originalBorder;
                receiptElement.style.padding = originalPadding;
                receiptElement.style.background = originalBackground;
                receiptElement.style.margin = originalMargin;
                
                // 创建下载链接
                const link = document.createElement('a');
                link.download = '小票_' + new Date().toLocaleString('zh-CN').replace(/[/:\s]/g, '-') + '.png';
                link.href = canvas.toDataURL('image/png');
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            });
        }

        // 本地存储
        function saveToLocalStorage() {
            localStorage.setItem('dishes', JSON.stringify(dishes));
            localStorage.setItem('drinks', JSON.stringify(drinks));
        }

        // 使用事件委托处理删除和编辑按钮
        document.addEventListener('click', function(e) {
            // 处理删除按钮
            if (e.target.classList.contains('delete-btn')) {
                const index = parseInt(e.target.dataset.originalIndex);
                const type = e.target.dataset.type;
                deleteItem(index, type);
            }
            
            // 处理编辑按钮
            if (e.target.classList.contains('edit-btn')) {
                const index = parseInt(e.target.dataset.originalIndex);
                const type = e.target.dataset.type;
                editItem(index, type);
            }
            
            // 点击其他区域隐藏搜索结果
            if (!e.target.closest('#itemSearch') && !e.target.closest('#searchResults')) {
                document.getElementById('searchResults').style.display = 'none';
            }
        });

        // 初始化导航栏点击事件
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化数据
            initData();
            
            // 初始化导航栏
            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', function() {
                    switchPage(this.dataset.page);
                });
            });
            
            // 初始化渲染
            renderItems('dish');
            renderItems('drink');
            renderOrderItems();
            
            // 设置默认点单页面
            switchPage('order');
        });
    </script>
</body>
</html>
