<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>点菜收银系统</title>
    <script src="vendor/html2canvas.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- ============================================================
             页面 1：桌号选择页
             ============================================================ -->
        <div id="tablePage" class="page active">
            <div class="table-page-header">
                <h2>桌号选择</h2>
                <button class="edit-dish-btn" onclick="navigateToPage('dishEditPage')">📝 菜品管理</button>
            </div>
            <div class="table-list" id="tableList"></div>
        </div>

        <!-- ============================================================
             页面 2：桌号点菜页（美团外卖式布局）
             ============================================================ -->
        <div id="orderPage" class="page">
            <div class="order-header-new">
                <div class="order-header-title" id="currentTableDisplay">内3</div>
                <div class="order-header-actions">
                    <button class="header-btn-small" onclick="clearTableDishes()">新桌</button>
                    <button class="header-btn-small" onclick="openChangeTableModal()">换桌</button>
                    <button class="header-btn-small" onclick="navigateToPage('tablePage')">返回</button>
                </div>
            </div>
            
            <div class="order-page-container">
                <div class="category-sidebar" id="categorySidebar"></div>
                <div class="dishes-content" id="dishesContent"></div>
            </div>
            
            <div class="order-drawer" id="orderDrawer">
                <div class="drawer-header">
                    <span class="drawer-title">已点菜品</span>
                    <button class="clear-all-btn" onclick="clearAllDishes()">清空全部</button>
                </div>
                <div class="drawer-content" id="drawerContent"></div>
            </div>
            
            <div class="bottom-float-bar">
                <div class="float-bar-content">
                    <div class="float-bar-left">
                        <div class="expand-btn" id="expandBtn" onclick="toggleOrderDrawer()">
                            <span style="font-size: 12px; font-weight: bold;" id="drawerBadge">0</span>
                        </div>
                        <div class="total-info">
                            <div class="total-amount" id="totalAmount">¥0</div>
                            <div class="total-count" id="totalCount">共0份</div>
                        </div>
                    </div>
                    <button class="ticket-btn-float" onclick="jumpToTicketPage()">小票</button>
                </div>
            </div>
        </div>

        <!-- ============================================================
             页面 3：菜品管理页
             ============================================================ -->
        <div id="dishEditPage" class="page">
            <div class="dish-edit-header">
                <h2>菜品管理</h2>
                <button class="back-table-btn" onclick="navigateToPage('tablePage')">返回桌号</button>
            </div>
            
            <div class="dish-edit-actions">
                <button class="dish-edit-action-btn btn-modify" onclick="openSearchDishModal()">📝 修改菜品</button>
                <button class="dish-edit-action-btn btn-add" onclick="openAddDishStep1()">➕ 添加菜品</button>
            </div>
            
            <div id="dishEditCategoryContainer"></div>
        </div>

        <!-- ============================================================
             页面 4：小票页面
             ============================================================ -->
        <div id="ticketPage" class="page">
            <div class="ticket-page-header">
                <h2>收银小票</h2>
                <button class="back-order-btn" onclick="navigateToPage('orderPage')" style="background: white; color: #f5576c;">返回点菜</button>
            </div>
            
            <div class="ticket-float-bar">
                <button class="order-btn-bar" onclick="navigateToPage('orderPage')">📝 点菜</button>
                <button class="generate-btn" onclick="generateTicket()">🧾 生成小票</button>
            </div>
            
            <div class="ticket-page-content">
                <div class="ticket-info-section">
                    <div class="ticket-input-group">
                        <label>桌号</label>
                        <input type="text" id="ticketTableNumber" readonly>
                    </div>
                </div>
                
                <div class="ticket-info-section">
                    <div class="ticket-input-group" style="position: relative;">
                        <label>🔍 搜索添加菜品/酒水（支持拼音首字母）</label>
                        <input type="text" id="ticketDishSearch" class="dashed-search" placeholder="输入名称或拼音首字母，如xlx、香辣虾..." oninput="searchDishForTicket()">
                        <div id="ticketSearchResult" class="search-results"></div>
                    </div>
                </div>

                <div class="ticket-preview-section">
                    <div class="preview-title">已点菜品预览</div>
                    <div class="preview-list" id="ticketPreviewList">
                        <div class="empty-preview">暂无菜品，请搜索添加</div>
                    </div>
                    
                    <div class="extra-fees-inline" id="extraFeesInline">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                            <span style="font-weight: bold; color: #2d3748; font-size: 15px;">额外费用</span>
                            <button class="manage-preset-btn" onclick="openPresetManageModal()">管理常用</button>
                        </div>
                        
                        <div id="presetFeesContainer"></div>
                        
                        <div class="extra-fee-input-row">
                            <input type="text" id="extraFeeName" placeholder="项目名称（如：纸巾）">
                            <input type="number" id="extraFeeAmount" step="0.1" placeholder="金额">
                            <button class="extra-fee-add-btn" onclick="addExtraFee()">添加</button>
                        </div>
                        
                        <div class="extra-fee-list" id="extraFeeList">
                            <div class="extra-fee-empty">暂无额外费用</div>
                        </div>
                    </div>
                </div>

                <div id="ticketDisplayArea"></div>
            </div>
        </div>

        <!-- ============================================================
             弹窗组件：点菜页相关
             ============================================================ -->
        
        <!-- 通用数量输入弹窗 -->
        <div id="quantityModal" class="quantity-modal">
            <div class="quantity-modal-content">
                <div class="close-modal" onclick="closeQuantityModal()">×</div>
                <div class="modal-title">输入数量</div>
                <div class="modal-dish-info">
                    <div class="modal-dish-name" id="modalDishName">菜品名称</div>
                    <div class="modal-dish-price" id="modalDishPrice">¥0.00</div>
                </div>
                <div class="quantity-input-group">
                    <label for="quantityInput">数量</label>
                    <input type="number" id="quantityInput" class="quantity-input" value="1" min="1" step="1">
                </div>
                <div class="modal-actions">
                    <button class="cancel-btn" onclick="closeQuantityModal()">取消</button>
                    <button class="confirm-btn" onclick="confirmQuantityModal()">确认添加</button>
                </div>
            </div>
        </div>

        <!-- 啤酒批量添加弹窗 -->
        <div id="beerQuantityModal" class="quantity-modal">
            <div class="quantity-modal-content">
                <div class="close-modal" onclick="closeBeerQuantityModal()">×</div>
                <div class="modal-title">啤酒快速添加</div>
                <div class="modal-dish-info">
                    <div class="modal-dish-name" id="beerModalDishName">啤酒名称</div>
                    <div class="modal-dish-price" id="beerModalDishPrice">¥0.00</div>
                </div>
                <div class="quantity-input-group">
                    <label for="beerQuantityInput">输入数量（瓶）</label>
                    <input type="number" id="beerQuantityInput" class="quantity-input" value="1" min="1" step="1" placeholder="例如：30">
                </div>
                <div class="modal-actions">
                    <button class="cancel-btn" onclick="closeBeerQuantityModal()">取消</button>
                    <button class="confirm-btn" onclick="confirmBeerQuantityModal()">确认添加</button>
                </div>
            </div>
        </div>

        <!-- 换桌弹窗 -->
        <div id="changeTableModal" class="change-table-modal">
            <div class="change-table-content">
                <div class="change-table-title">选择目标桌号</div>
                <div style="margin-bottom: 10px; color: #666; font-size: 14px; text-align: center;">
                    将【<span id="changeTableSource" style="font-weight: bold; color: #333;"></span>】的菜品换到：
                </div>
                <div class="change-table-grid" id="changeTableGrid"></div>
                <div style="display: flex; gap: 10px;">
                    <button class="cancel-btn" style="flex: 1; padding: 12px;" onclick="closeChangeTableModal()">取消</button>
                    <button class="confirm-btn" style="flex: 1; padding: 12px;" onclick="confirmChangeTable()">确认换桌</button>
                </div>
            </div>
        </div>

        <!-- ============================================================
             弹窗组件：小票页相关
             ============================================================ -->
        
        <!-- 临时菜品添加弹窗 -->
        <div id="tempDishModal" class="quantity-modal">
            <div class="quantity-modal-content">
                <div class="close-modal" onclick="closeTempDishModal()">×</div>
                <div class="modal-title">添加临时菜品</div>
                <div style="background: #f0f0f0; padding: 10px; border-radius: 8px; margin-bottom: 15px; text-align: center; color: #666; font-size: 14px;">
                    菜单上没有这道菜，手动添加
                </div>
                <div class="quantity-input-group">
                    <label for="tempDishName">菜品名称</label>
                    <input type="text" id="tempDishName" class="quantity-input" placeholder="输入菜名" style="text-align: left; font-size: 16px;">
                </div>
                <div class="quantity-input-group">
                    <label for="tempDishPrice">价格（元）</label>
                    <input type="number" id="tempDishPrice" class="quantity-input" placeholder="0" step="0.1" style="text-align: left; font-size: 16px;">
                </div>
                <div class="quantity-input-group">
                    <label for="tempDishQty">数量</label>
                    <input type="number" id="tempDishQty" class="quantity-input" value="1" min="1" step="1">
                </div>
                <div class="modal-actions">
                    <button class="cancel-btn" onclick="closeTempDishModal()">取消</button>
                    <button class="confirm-btn" onclick="confirmAddTempDish()">确认添加</button>
                </div>
            </div>
        </div>

        <!-- 管理固定项弹窗 -->
        <div id="presetManageModal" class="quantity-modal preset-manage-modal">
            <div class="quantity-modal-content">
                <div class="close-modal" onclick="closePresetManageModal()">×</div>
                <div class="modal-title">管理常用固定项</div>
                <div style="margin-bottom: 15px; color: #666; font-size: 14px;">
                    添加常用的固定费用项（如纸巾、打包盒），只需输入金额即可快速添加。
                </div>
                <div id="presetListContainer" style="max-height: 200px; overflow-y: auto; margin-bottom: 15px;"></div>
                <div style="display: flex; gap: 8px; margin-bottom: 15px;">
                    <input type="text" id="newPresetName" placeholder="项目名称（如：纸巾）" style="flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
                    <button class="confirm-btn" onclick="addNewPreset()" style="padding: 10px 16px;">添加</button>
                </div>
                <button class="cancel-btn" style="width: 100%;" onclick="closePresetManageModal()">关闭</button>
            </div>
        </div>

        <!-- ============================================================
             弹窗组件：菜品管理页相关
             ============================================================ -->
        
        <!-- 菜品搜索弹窗（修改菜品用） -->
        <div id="searchDishModal" class="quantity-modal">
            <div class="quantity-modal-content dish-search-modal-content">
                <div class="close-modal" onclick="closeSearchDishModal()">×</div>
                <div class="modal-title">搜索菜品</div>
                <input type="text" class="dish-search-input" id="modifyDishSearchInput" placeholder="输入菜品名称搜索..." oninput="searchDishForModify()">
                <div class="dish-search-results" id="modifyDishSearchResults"></div>
            </div>
        </div>

        <!-- 编辑菜品弹窗 -->
        <div id="editDishModal" class="quantity-modal">
            <div class="quantity-modal-content add-dish-form-modal">
                <div class="close-modal" onclick="closeEditDishModal()">×</div>
                <div class="modal-title">修改菜品</div>
                <div class="form-item">
                    <label>菜品名称</label>
                    <input type="text" id="editModalDishName" placeholder="输入菜品名称">
                </div>
                <div class="form-item">
                    <label>菜品价格</label>
                    <input type="number" step="0.01" id="editModalDishPrice" placeholder="输入菜品价格（元）">
                </div>
                <div class="form-item">
                    <label>菜品分类</label>
                    <select id="editModalDishCategory">
                        <option value="烤鱼类">烤鱼类</option>
                        <option value="汤锅类">汤锅类</option>
                        <option value="配菜类">配菜类</option>
                        <option value="凉菜类">凉菜类</option>
                        <option value="主食点心">主食点心</option>
                        <option value="炒菜类">炒菜类</option>
                        <option value="干锅铁板">干锅铁板</option>
                        <option value="啤酒类">啤酒类</option>
                        <option value="白酒类">白酒类</option>
                        <option value="饮料类">饮料类</option>
                    </select>
                </div>
                <input type="hidden" id="editModalDishGlobalId" value="">
                <div class="modal-actions">
                    <button class="cancel-btn" onclick="closeEditDishModal()">取消</button>
                    <button class="confirm-btn" onclick="saveEditDishFromModal()">保存修改</button>
                </div>
            </div>
        </div>

        <!-- 添加菜品步骤1：选择分类 -->
        <div id="addDishStep1Modal" class="quantity-modal">
            <div class="quantity-modal-content">
                <div class="close-modal" onclick="closeAddDishStep1()">×</div>
                <div class="modal-title">选择菜品分类</div>
                <div class="category-select-grid" id="addDishCategoryGrid"></div>
                <button class="cancel-btn" style="width: 100%; margin-top: 10px;" onclick="closeAddDishStep1()">取消</button>
            </div>
        </div>

        <!-- 添加菜品步骤2：填写信息 -->
        <div id="addDishStep2Modal" class="quantity-modal">
            <div class="quantity-modal-content add-dish-form-modal">
                <div class="close-modal" onclick="closeAddDishStep2()">×</div>
                <div class="modal-title">添加菜品信息</div>
                <div class="form-item">
                    <label>菜品分类</label>
                    <input type="text" id="addModalDishCategoryDisplay" readonly style="background: #f0f0f0;">
                    <input type="hidden" id="addModalDishCategory">
                </div>
                <div class="form-item">
                    <label>菜品名称</label>
                    <input type="text" id="addModalDishName" placeholder="输入菜品名称">
                </div>
                <div class="form-item">
                    <label>菜品价格</label>
                    <input type="number" step="0.01" id="addModalDishPrice" placeholder="输入菜品价格（元）">
                </div>
                <div class="modal-actions">
                    <button class="cancel-btn" onclick="closeAddDishStep2()">取消</button>
                    <button class="confirm-btn" onclick="saveAddDishFromModal()">确认添加</button>
                </div>
            </div>
        </div>

        <!-- ============================================================
             全局组件：加载与提示
             ============================================================ -->
        <div class="loading-spinner" id="loadingSpinner">
            <div class="spinner"></div>
            <div style="margin-top: 12px; font-size: 15px; color: #666;">加载中...</div>
        </div>
        
        <div id="toastContainer" class="toast"></div>
    </div>

    <script src="js/dishes.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
